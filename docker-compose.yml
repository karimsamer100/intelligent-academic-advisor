# Local development environment: FastAPI backend + PostgreSQL (with pgvector).
#
#   cp .env.example .env
#   docker compose up --build
#
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network PostgreSQL is reachable as "postgres".
      # DATABASE_URL is blanked so the backend builds it from POSTGRES_* (which
      # also handles special characters in the password).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: ""
      ACADEMIC_DATA_FOUNDATION_PATH: /data/academic
      DOCUMENTS_PATH: /data/academic/raw/documents
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-1024}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-16}"
      EMBEDDING_CACHE_DIR: /data/model-cache
      CHUNK_SIZE: "${CHUNK_SIZE:-1400}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-180}"
      CHUNK_MIN_CHARS: "${CHUNK_MIN_CHARS:-80}"
      RAG_TOP_K: "${RAG_TOP_K:-5}"
      RAG_MAX_TOP_K: "${RAG_MAX_TOP_K:-20}"
      RAG_MIN_SCORE: "${RAG_MIN_SCORE:-}"
      PIPELINE_VERSION: ${PIPELINE_VERSION:-rag-v0.1.0}
      PRESERVE_RAW_EXTRACTION: "${PRESERVE_RAW_EXTRACTION:-true}"
      RAW_EXTRACT_DIR: /data/rag_debug/extracted
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    # Apply migrations (enables pgvector), then start the API with hot reload.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
