# Local development environment: FastAPI backend + PostgreSQL (with pgvector).
#
#   cp .env.example .env
#   docker compose up --build
#
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network PostgreSQL is reachable as "postgres".
      # DATABASE_URL is blanked so the backend builds it from POSTGRES_* (which
      # also handles special characters in the password).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: ""
      DOCUMENTS_PATH: /data/documents
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    # Apply migrations (enables pgvector), then start the API with hot reload.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
