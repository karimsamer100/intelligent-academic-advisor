services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-advisor}
      POSTGRES_USER: ${POSTGRES_USER:-advisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advisor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - advisor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-advisor} -d ${POSTGRES_DB:-advisor}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Local Intelligent Academic Advisor}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-advisor}:${POSTGRES_PASSWORD:-advisor}@postgres:5432/${POSTGRES_DB:-advisor}
      POSTGRES_DB: ${POSTGRES_DB:-advisor}
      POSTGRES_USER: ${POSTGRES_USER:-advisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advisor}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ACADEMIC_DATA_FOUNDATION_PATH: ${ACADEMIC_DATA_FOUNDATION_PATH:-/app/data/academic_foundation}
      DOCUMENTS_PATH: ${DOCUMENTS_PATH:-/app/data/academic_foundation/raw/documents}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_CACHE_DIR: /root/.cache/huggingface
      # Avoid a duplicate background weights download when the model ships .bin weights.
      DISABLE_SAFETENSORS_CONVERSION: "true"
      CHUNK_SIZE: ${CHUNK_SIZE:-1400}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-180}
      CHUNK_MIN_CHARS: ${CHUNK_MIN_CHARS:-80}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MAX_TOP_K: ${RAG_MAX_TOP_K:-20}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-}
      PIPELINE_VERSION: ${PIPELINE_VERSION:-rag-v0.1.0}
      PRESERVE_RAW_EXTRACTION: ${PRESERVE_RAW_EXTRACTION:-true}
      RAW_EXTRACT_DIR: /app/data/rag_debug/extracted
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  advisor_pgdata:
  hf_cache:
